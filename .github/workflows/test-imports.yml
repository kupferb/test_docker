name: Test Package Imports

on:
  workflow_dispatch: # Allows you to trigger it manually from the GitHub web UI
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements.txt file in your repo:
          pip install -r requirements.txt
          
          # Alternatively, install them inline if testing without a file:
          # pip install numpy==1.23.5 tensorflow==2.12.0 torch torchvision --index-url https://download.pytorch.org/whl/cu128

      - name: Run Import Tests
        run: |
          python -c "
          import numpy as np
          import tensorflow as tf
          import torch
          
          print('--- SUCCESS ---')
          print('NumPy version:', np.__version__)
          print('TensorFlow version:', tf.__version__)
          print('PyTorch version:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          "
