name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Runs automatically whenever you push code to the main branch
    paths:
      - 'Dockerfile'
      - 'requirements.txt'  
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (Docker's modern build engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub using the repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build the image and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/linux_pycharm_gui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/linux_pycharm_gui:2.0.0
            ${{ secrets.DOCKERHUB_USERNAME }}/linux_pycharm_gui:${{ github.sha }}
