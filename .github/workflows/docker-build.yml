name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # Runs automatically whenever you push code to the main branch
  workflow_dispatch: # Allows you to manually trigger the build from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up QEMU (optional, for multi-platform builds like arm64/amd64)
      - name: Set up QEMU
        uses: actions/docker-buildx-babel-action@v3

      # Step 3: Set up Docker Buildx (Docker's modern build engine)
      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      # Step 4: Log in to Docker Hub using the repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Build the image and push it to Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}
